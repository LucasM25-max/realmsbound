<!doctype html><html><body style="margin:0;background:#5d7a44">
<canvas id="c" width="1280" height="900" style="image-rendering:pixelated"></canvas>
<script type="module">
import { buildHero } from './js/art/hero.js';
import { buildRat } from './js/art/rat.js';
const c = document.getElementById('c'), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
try {
const h = buildHero(), r = buildRat();
const S = 4;
Object.values(h.combat).forEach((f, i) => x.drawImage(f, 10 + i * 210, 10, f.width * 3, f.height * 3));
x.drawImage(h.idle[0], 10, 280, h.idle[0].width * 3, h.idle[0].height * 3);
[...r.run, r.crouch, r.bite, r.hit].forEach((f, i) => x.drawImage(f, 10 + (i % 4) * 250, 520 + Math.floor(i / 4) * 140, f.width * S, f.height * S));
} catch (e) { console.error(e.stack); }
window.__ok = true;
</script></body></html>
